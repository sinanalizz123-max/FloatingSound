plugins {
    id 'com.android.application'
}

android {
    namespace 'com.floatsound.volume'
    compileSdk 34
    defaultConfig {
        applicationId 'com.floatsound.volume'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources {
            excludes += ['META-INF/**']
        }
    }
}

dependencies {
}
